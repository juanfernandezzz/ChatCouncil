name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      # PRU-001: la app compilada se prueba sola sobre una carpeta temporal; el paso falla si no sale con 0.
      - name: autoprueba
        shell: pwsh
        timeout-minutes: 5
        run: |
          cargo build -p app
          $salida = Join-Path $env:RUNNER_TEMP 'autoprueba.txt'
          $p = Start-Process .\target\debug\ChatCouncilNueva.exe -ArgumentList '-autoprueba', $salida -PassThru -Wait
          if (Test-Path $salida) { Get-Content $salida -Encoding UTF8 } else { "No se escribió $salida" }
          "Código de salida: $($p.ExitCode)"
          exit $p.ExitCode
      # PRU-T19: las tres fases de la interfaz, en arranques distintos sobre la misma carpeta temporal.
      - name: pruebainterfaz
        shell: pwsh
        timeout-minutes: 10
        run: |
          $datos = Join-Path $env:RUNNER_TEMP 'pruebainterfaz'
          New-Item -ItemType Directory $datos | Out-Null
          foreach ($fase in 1, 2, 3) {
            $salida = Join-Path $env:RUNNER_TEMP "pruebainterfaz-$fase.txt"
            $p = Start-Process .\target\debug\ChatCouncilNueva.exe -ArgumentList '-pruebainterfaz', $salida, '-datos', $datos, '-fase', "$fase" -PassThru -Wait
            if (Test-Path $salida) { Get-Content $salida -Encoding UTF8 } else { "No se escribió $salida" }
            "Código de salida de la fase ${fase}: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          }
      # PRU-012, PRU-013 y PRU-016: la Ronda con páginas locales, hasta el fin de la investigación.
      - name: pruebaronda
        shell: pwsh
        timeout-minutes: 10
        run: |
          $datos = Join-Path $env:RUNNER_TEMP 'pruebaronda'
          New-Item -ItemType Directory $datos | Out-Null
          $salida = Join-Path $env:RUNNER_TEMP 'pruebaronda.txt'
          $p = Start-Process .\target\debug\ChatCouncilNueva.exe -ArgumentList '-pruebaronda', $salida, '-datos', $datos -PassThru -Wait
          if (Test-Path $salida) { Get-Content $salida -Encoding UTF8 } else { "No se escribió $salida" }
          "Código de salida: $($p.ExitCode)"
          exit $p.ExitCode
