# T25: compila la app de Unity para Windows (instalador) y Android (.apk firmado con la llave fija) y los publica en
# el Release chatcouncil-unity-v1 (D55 a D58). La compilación es scripts/unity/compilar-app.ps1, el mismo script que en
# local. Si un paso falla, sus últimas líneas van como anotación (::error), que se lee sin entrar al log.
name: unity

on:
  push:
    branches: [main]
    paths: ['unity/**', 'panel/**', 'motor/**', 'pagina/**', 'instalador/**', 'scripts/unity/**', '.github/workflows/unity.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unity
  cancel-in-progress: false

jobs:
  # Lo barato primero (1 a 2 min): lo que no se versiona y los secretos. Antes, cada uno de estos fallos se veía
  # recién después de instalar Unity.
  comprobar:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: pagina.js y la DLL del panel
        shell: pwsh
        run: scripts/unity/compilar-app.ps1 -SoloPreparar

      - name: Secretos
        shell: pwsh
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          LLAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          function Fallar($m) { Write-Host "::error title=Secretos::$m"; exit 1 }
          $faltan = 'UNITY_EMAIL', 'UNITY_PASSWORD', 'LLAVE', 'ANDROID_KEYSTORE_PASS' | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($faltan) { Fallar ("faltan: " + ($faltan -join ', ') + " (LLAVE es ANDROID_KEYSTORE_BASE64)") }
          $f = Join-Path $env:RUNNER_TEMP 'llave.p12'
          try { [IO.File]::WriteAllBytes($f, [Convert]::FromBase64String($env:LLAVE)) } catch { Fallar 'ANDROID_KEYSTORE_BASE64 no es base64: vuelve a pegarlo con llave.ps1' }
          & (Join-Path $env:JAVA_HOME 'bin\keytool.exe') -list -keystore $f -storetype PKCS12 -storepass $env:ANDROID_KEYSTORE_PASS -alias chatcouncil *> $null
          $codigo = $LASTEXITCODE
          Remove-Item $f -Force
          if ($codigo -ne 0) { Fallar 'la llave no abre con ANDROID_KEYSTORE_PASS o no tiene el alias chatcouncil' }
          Write-Host 'Secretos: los cuatro están y la llave abre.'

  windows:
    needs: comprobar
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # Library guarda lo ya importado y lo ya compilado por IL2CPP: con ella, la compilación es incremental.
      - uses: actions/cache@v6
        with:
          path: unity/Library
          key: library-windows-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}
          restore-keys: library-windows-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-

      - uses: RageAgainstThePixel/unity-setup@v2
        id: unity
        with:
          version-file: unity/ProjectSettings/ProjectVersion.txt
          build-targets: StandaloneWindows64
          modules: windows-il2cpp

      - uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Compilar (IL2CPP)
        shell: pwsh
        run: scripts/unity/compilar-app.ps1 -Plataforma Windows -Salida "$pwd\build\windows\ChatCouncil.exe" -Editor "${{ steps.unity.outputs.unity-editor-path }}"

      # Medido, no exigido todavía: si WebView2 corre en el runner, pasa a frenar el Release.
      - name: Autoprueba del build
        shell: pwsh
        continue-on-error: true
        run: |
          $salida = "$pwd\build\autoprueba.txt"
          $p = Start-Process -FilePath build\windows\ChatCouncil.exe -PassThru -ArgumentList @('-autoprueba', "`"$salida`"")
          if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Host '::warning title=Autoprueba::no terminó en 10 min'; exit 1 }
          if (-not (Test-Path $salida)) { Write-Host '::warning title=Autoprueba::no dejó informe'; exit 1 }
          Get-Content $salida
          $ok = @(Select-String -Path $salida -Pattern '^OK').Count
          $fallas = @(Select-String -Path $salida -Pattern '^FALLA' | ForEach-Object Line)
          if ($fallas) { Write-Host ("::warning title=Autoprueba $ok OK, $($fallas.Count) FALLA::" + ($fallas -join '%0A')); exit 1 }
          Write-Host "::notice title=Autoprueba::$ok OK, 0 FALLA"

      - name: Instalador
        shell: pwsh
        run: |
          # Lo que Unity deja junto al build y no se distribuye.
          Get-ChildItem build\windows -Directory | Where-Object { $_.Name -like '*DoNotShip' -or $_.Name -like '*ButDontShipItWithYourGame' } | Remove-Item -Recurse -Force
          Remove-Item build\windows\ChatCouncil.exe.log -ErrorAction SilentlyContinue
          $version = (Select-String -Path unity\ProjectSettings\ProjectSettings.asset -Pattern 'bundleVersion: (.+)').Matches[0].Groups[1].Value.Trim()
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" instalador\ChatCouncil.iss *> instalador.log
          $codigo = $LASTEXITCODE
          Get-Content instalador.log
          if ($codigo -ne 0) { Write-Host ("::error title=Inno Setup::" + ((Get-Content instalador.log -Tail 30) -join '%0A')); exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: salida/ChatCouncil-instalador.exe
          if-no-files-found: error

  # Android también en Windows, como se compila a mano: la Hub no se instaló en ubuntu-latest (D56).
  android:
    needs: comprobar
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: unity/Library
          key: library-android-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}
          restore-keys: library-android-${{ hashFiles('unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectVersion.txt') }}-

      - uses: RageAgainstThePixel/unity-setup@v2
        id: unity
        with:
          version-file: unity/ProjectSettings/ProjectVersion.txt
          build-targets: Android

      - uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      # La llave se escribe en RUNNER_TEMP solo para compilar y se borra al terminar.
      - name: Compilar (IL2CPP, firmado)
        shell: pwsh
        env:
          LLAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          $env:ANDROID_KEYSTORE_PATH = Join-Path $env:RUNNER_TEMP 'chatcouncil.keystore'
          [IO.File]::WriteAllBytes($env:ANDROID_KEYSTORE_PATH, [Convert]::FromBase64String($env:LLAVE))
          try { scripts/unity/compilar-app.ps1 -Plataforma Android -Salida "$pwd\build\ChatCouncil.apk" -Editor "${{ steps.unity.outputs.unity-editor-path }}" }
          finally { Remove-Item $env:ANDROID_KEYSTORE_PATH -Force }

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: build/ChatCouncil.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: salida
          merge-multiple: true

      # shortcut: la etiqueta queda en el commit de la primera publicación y cada corrida reemplaza los archivos;
      # si hace falta saber de qué commit es cada binario, publicar un Release por versión.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: chatcouncil-unity-v1
          name: ChatCouncil (Unity) v1
          target_commitish: ${{ github.sha }}
          body: |
            ChatCouncil para Windows y Android, compilado desde ${{ github.sha }}.
            - Windows: descarga ChatCouncil-instalador.exe y ábrelo.
            - Android: descarga ChatCouncil.apk en el teléfono y ábrelo.
          files: |
            salida/ChatCouncil-instalador.exe
            salida/ChatCouncil.apk
