# T25: compila la app de Unity para Windows (instalador) y Android (.apk firmado con la llave fija) y los publica en
# el Release chatcouncil-unity-v1. Licencia Personal por UNITY_EMAIL y UNITY_PASSWORD (Unity 6 ya no da el .ulf).
# Si un paso falla, sus últimas líneas van como anotación (::error), que se lee sin entrar al log.
name: unity

on:
  push:
    branches: [main]
    paths: ['unity/**', 'panel/**', 'motor/**', 'instalador/**', '.github/workflows/unity.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unity
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      # La DLL del panel no se versiona: se compila con MSVC y el SDK de WebView2 fijado por SHA-256.
      - name: Plugin nativo (WebView2)
        shell: pwsh
        run: |
          cmd /c panel\windows\compilar.cmd *> plugin.log
          $codigo = $LASTEXITCODE
          Get-Content plugin.log
          if ($codigo -ne 0) { Write-Host ("::error title=compilar.cmd::" + ((Get-Content plugin.log -Tail 30) -join '%0A')); exit 1 }

      - uses: RageAgainstThePixel/unity-setup@v2
        id: unity
        with:
          version-file: unity/ProjectSettings/ProjectVersion.txt
          build-targets: StandaloneWindows64
          modules: windows-il2cpp

      - uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      # Unity.exe es una app de ventana: Start-Process -Wait espera a que termine y da su código de salida.
      - name: Compilar (IL2CPP)
        shell: pwsh
        env:
          EDITOR: ${{ steps.unity.outputs.unity-editor-path }}
        run: |
          trap { Write-Host "::error title=Compilar::$_"; exit 1 }
          New-Item -ItemType Directory -Force build | Out-Null
          $p = Start-Process -FilePath $env:EDITOR -Wait -PassThru -NoNewWindow -ArgumentList @(
            '-batchmode', '-quit', '-buildTarget', 'Win64', '-projectPath', 'unity', '-logFile', "$pwd\build\unity.log",
            '-executeMethod', 'ChatCouncil.Construccion.Construir.Windows', '-salida', "$pwd\build\windows\ChatCouncil.exe")
          Get-Content build\unity.log -Tail 80
          if ($p.ExitCode -ne 0 -or -not (Test-Path build\windows\ChatCouncil.exe)) {
            Write-Host ("::error title=Unity Windows::" + ((Select-String -Path build\unity.log -Pattern 'error|failed' | Select-Object -Last 30 | ForEach-Object Line) -join '%0A'))
            exit 1
          }

      - name: Instalador
        shell: pwsh
        run: |
          # Lo que Unity deja junto al build y no se distribuye.
          Get-ChildItem build\windows -Directory | Where-Object { $_.Name -like '*DoNotShip' -or $_.Name -like '*ButDontShipItWithYourGame' } | Remove-Item -Recurse -Force
          $version = (Select-String -Path unity\ProjectSettings\ProjectSettings.asset -Pattern 'bundleVersion: (.+)').Matches[0].Groups[1].Value.Trim()
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$version" instalador\ChatCouncil.iss *> instalador.log
          $codigo = $LASTEXITCODE
          Get-Content instalador.log
          if ($codigo -ne 0) { Write-Host ("::error title=Inno Setup::" + ((Get-Content instalador.log -Tail 30) -join '%0A')); exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: salida/ChatCouncil-instalador.exe
          if-no-files-found: error

  # Android también en Windows, como se compila a mano: la Hub no se instaló en ubuntu-latest (/opt/unityhub).
  android:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: RageAgainstThePixel/unity-setup@v2
        id: unity
        with:
          version-file: unity/ProjectSettings/ProjectVersion.txt
          build-targets: Android

      - uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      # La llave se escribe en RUNNER_TEMP solo para compilar y se borra al terminar.
      - name: Compilar (IL2CPP, firmado)
        shell: pwsh
        env:
          EDITOR: ${{ steps.unity.outputs.unity-editor-path }}
          LLAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          trap { Write-Host "::error title=Compilar::$_"; exit 1 }
          New-Item -ItemType Directory -Force build | Out-Null
          $env:ANDROID_KEYSTORE_PATH = Join-Path $env:RUNNER_TEMP 'chatcouncil.keystore'
          [IO.File]::WriteAllBytes($env:ANDROID_KEYSTORE_PATH, [Convert]::FromBase64String($env:LLAVE))
          $p = Start-Process -FilePath $env:EDITOR -Wait -PassThru -NoNewWindow -ArgumentList @(
            '-batchmode', '-quit', '-buildTarget', 'Android', '-projectPath', 'unity', '-logFile', "$pwd\build\unity.log",
            '-executeMethod', 'ChatCouncil.Construccion.Construir.Android', '-salida', "$pwd\build\ChatCouncil.apk")
          Remove-Item $env:ANDROID_KEYSTORE_PATH -Force
          Get-Content build\unity.log -Tail 80
          if ($p.ExitCode -ne 0 -or -not (Test-Path build\ChatCouncil.apk)) {
            Write-Host ("::error title=Unity Android::" + ((Select-String -Path build\unity.log -Pattern 'error|failed|FAILURE' | Select-Object -Last 30 | ForEach-Object Line) -join '%0A'))
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: build/ChatCouncil.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: salida
          merge-multiple: true

      # shortcut: la etiqueta queda en el commit de la primera publicación y cada corrida reemplaza los archivos;
      # si hace falta saber de qué commit es cada binario, publicar un Release por versión.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: chatcouncil-unity-v1
          name: ChatCouncil (Unity) v1
          target_commitish: ${{ github.sha }}
          body: |
            ChatCouncil para Windows y Android, compilado desde ${{ github.sha }}.
            - Windows: descarga ChatCouncil-instalador.exe y ábrelo.
            - Android: descarga ChatCouncil.apk en el teléfono y ábrelo.
          files: |
            salida/ChatCouncil-instalador.exe
            salida/ChatCouncil.apk
