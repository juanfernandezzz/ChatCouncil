<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Proveedores al iniciar</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 16px 20px; font: 14px/1.5 system-ui, sans-serif; background: #1a1714; color: #e8e2d9; }
      p { margin: 0 0 12px; opacity: .85; white-space: pre-line; }
      #casillas { display: grid; gap: 4px; margin-bottom: 14px; }
      label { display: flex; gap: 8px; align-items: center; }
      .acciones { display: flex; gap: 8px; margin-bottom: 10px; }
      button { padding: 7px 14px; background: #3a332c; color: inherit; border: 1px solid #4a4238; border-radius: 6px; cursor: pointer; font: inherit; }
      button.primario { background: #5a4a33; border-color: #6d5a3e; }
      #error { color: #d98c7a; min-height: 1.5em; margin-bottom: 6px; }
      #pie { font-size: 12.5px; opacity: .7; }
    </style>
  </head>
  <body>
    <p>Elegí qué proveedores se cargan la próxima vez que abras ChatCouncil.
Para probar un solo proveedor, marcá solo ese: así queda siempre al
frente y funciona como en uso real.</p>
    <div id="casillas"></div>
    <div class="acciones">
      <button id="marcar-todos">Marcar todos</button>
      <button id="guardar" class="primario">Guardar</button>
    </div>
    <div id="error"></div>
    <p id="pie">Los cambios se aplican al reiniciar la app.</p>
    <script type="module">
      const NOMBRES = {
        chatgpt: "ChatGPT", gemini: "Gemini", claude: "Claude", grok: "Grok", mistral: "Mistral",
        glm: "GLM", kimi: "Kimi", qwen: "Qwen", deepseek: "DeepSeek",
      };
      const cc = window.cc;
      const casillas = document.getElementById("casillas");
      const error = document.getElementById("error");
      const { conocidos, marcados } = await cc.seleccionLeer();
      for (const id of conocidos) {
        const label = document.createElement("label");
        const chk = document.createElement("input");
        chk.type = "checkbox";
        chk.value = id;
        chk.checked = marcados.includes(id);
        label.append(chk, NOMBRES[id] ?? id);
        casillas.append(label);
      }
      const todas = () => [...casillas.querySelectorAll("input")];
      document.getElementById("marcar-todos").onclick = () => todas().forEach((c) => (c.checked = true));
      document.getElementById("guardar").onclick = async () => {
        const r = await cc.seleccionGuardar(todas().filter((c) => c.checked).map((c) => c.value));
        error.textContent = r.ok ? "" : r.error;
        if (r.ok) window.close();
      };
    </script>
  </body>
</html>
