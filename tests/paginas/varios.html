<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Autoprueba: varios mensajes del asistente</title></head>
<body>
  <!-- PART-030: un asistente que responde en varios mensajes (Muse): uno anterior al último mensaje del usuario y dos después. -->
  <main id="chat">
    <div class="usuario">Pregunta vieja</div>
    <div class="respuesta">Respuesta vieja</div>
    <div class="usuario">Pregunta nueva</div>
    <div class="respuesta">Primero</div>
    <div class="respuesta">Segundo</div>
  </main>
  <textarea id="compositor" rows="6" cols="60"></textarea>
</body>
</html>
